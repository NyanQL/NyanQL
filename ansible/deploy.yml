---
- name: Build and deploy NyanQL MCP with direct HTTPS
  hosts: nyanql
  become: true
  gather_facts: true

  vars_prompt:
    - name: letsencrypt_email
      prompt: "Let's Encrypt account email"
      private: false
    - name: nyanql_basic_username
      prompt: "NyanQL Basic Auth username (':' is not allowed)"
      private: false
    - name: nyanql_basic_password
      prompt: "NyanQL Basic Auth password (12 characters or longer)"
      private: true
      confirm: true
    - name: nyanql_oauth_username
      prompt: "Initial OAuth username (3 to 128 characters)"
      private: false
    - name: nyanql_oauth_password
      prompt: "Initial OAuth password (12 characters or longer)"
      private: true
      confirm: true

  vars:
    project_root: "{{ playbook_dir }}/.."
    nyanql_public_ip: "153.126.182.172"
    nyanql_public_hostname: "stamp.necomori.asia"
    nyanql_public_origin: "https://{{ nyanql_public_hostname }}"
    nyanql_ssh_port: 2222
    nyanql_https_port: 443
    nyanql_version: "v0.0.21-mcp-oauth"

    nyanql_service_user: nyanql
    nyanql_service_group: nyanql
    nyanql_root: /opt/nyanql
    nyanql_source_dir: /opt/nyanql/src
    nyanql_api_path: /opt/nyanql/src/api.json
    nyanql_binary_dir: /opt/nyanql/bin
    nyanql_binary_path: /opt/nyanql/bin/NyanQL
    nyanql_previous_binary_path: /opt/nyanql/bin/NyanQL.previous
    nyanql_config_dir: /etc/nyanql
    nyanql_tls_dir: /etc/nyanql/tls
    nyanql_data_dir: /var/lib/nyanql
    nyanql_database_path: /var/lib/nyanql/stamps.db
    nyanql_backup_dir: /var/lib/nyanql/backups
    nyanql_pre_migration_backup: /var/lib/nyanql/backups/stamps-before-oauth-v3.db
    nyanql_log_dir: /var/log/nyanql
    nyanql_acme_webroot: /var/lib/nyanql/acme
    nyanql_build_dir: /var/tmp/nyanql-build
    nyanql_staged_api_path: /var/tmp/nyanql-build/api.json
    nyanql_seed_database: "{{ project_root }}/stamps.db"

    nyanql_swap_path: /swapfile
    nyanql_swap_size: 10G
    nyanql_swap_size_bytes: 10737418240

    go_version: "1.26.5"
    go_archive_checksums:
      amd64: "5c2c3b16caefa1d968a94c1daca04a7ca301a496d9b086e17ad77bb81393f053"
      arm64: "fe4789e92b1f33358680864bbe8704289e7bb5fc207d80623c308935bd696d49"
    go_architecture_map:
      x86_64: amd64
      aarch64: arm64

    certbot_version: "5.4.0"
    certbot_venv: /opt/certbot
    letsencrypt_cert_name: "{{ nyanql_public_hostname }}"
    letsencrypt_live_dir: "/etc/letsencrypt/live/{{ letsencrypt_cert_name }}"
    legacy_letsencrypt_cert_name: nyanql-ip
    nyanql_remove_legacy_ip_certificate: false

  pre_tasks:
    - name: Verify deployment target
      ansible.builtin.assert:
        that:
          - ansible_host == nyanql_public_ip
          - (ansible_port | int) == nyanql_ssh_port
        fail_msg: >-
          inventory.ini must target {{ nyanql_public_ip }} over SSH port
          {{ nyanql_ssh_port }}.

    - name: Verify Let's Encrypt account email
      ansible.builtin.assert:
        that:
          - (letsencrypt_email | string | trim | length) > 3
          - (letsencrypt_email | string | trim | upper) != 'CHANGE_ME'
          - (letsencrypt_email | string | trim) is match('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
        fail_msg: >-
          Enter a real email address at the "Let's Encrypt account email" prompt.

    - name: Verify Basic Auth username
      ansible.builtin.assert:
        that:
          - (nyanql_basic_username | string | trim | length) > 0
          - (nyanql_basic_username | string | trim | upper) != 'CHANGE_ME'
          - "':' not in (nyanql_basic_username | string)"
        fail_msg: >-
          Enter a non-empty value other than CHANGE_ME that does not contain
          ':' at the "NyanQL Basic Auth username" prompt.

    - name: Verify Basic Auth password
      ansible.builtin.assert:
        that:
          - (nyanql_basic_password | string | length) >= 12
          - (nyanql_basic_password | string | upper) != 'CHANGE_ME'
        fail_msg: >-
          The NyanQL Basic Auth password must contain at least 12 characters
          and must not be CHANGE_ME.
      no_log: true

    - name: Verify OAuth bootstrap username
      ansible.builtin.assert:
        that:
          - (nyanql_oauth_username | string | trim | length) >= 3
          - (nyanql_oauth_username | string | trim | length) <= 128
          - (nyanql_oauth_username | string | trim | upper) != 'CHANGE_ME'
        fail_msg: >-
          Enter a value containing 3 to 128 characters other than CHANGE_ME
          at the "Initial OAuth username" prompt.

    - name: Verify OAuth bootstrap password
      ansible.builtin.assert:
        that:
          - (nyanql_oauth_password | string | length) >= 12
          - (nyanql_oauth_password | string | length) <= 1024
          - (nyanql_oauth_password | string | upper) != 'CHANGE_ME'
        fail_msg: >-
          The initial OAuth password must contain between 12 and 1024
          characters and must not be CHANGE_ME.
      no_log: true

    - name: Verify supported VPS architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture in go_architecture_map
        fail_msg: "Unsupported architecture for the pinned Go archive: {{ ansible_architecture }}"

    - name: Select Go archive architecture
      ansible.builtin.set_fact:
        go_archive_arch: "{{ go_architecture_map[ansible_architecture] }}"

  tasks:
    - name: Install operating-system dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - ca-certificates
          - curl
          - git
          - openssl
          - python3
          - python3-pip
          - python3-venv
          - sqlite3
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Inspect swap file
      ansible.builtin.stat:
        path: "{{ nyanql_swap_path }}"
      register: nyanql_swap_file

    - name: Verify an existing swap file has the requested size
      ansible.builtin.assert:
        that:
          - (not nyanql_swap_file.stat.exists) or ((nyanql_swap_file.stat.size | int) == nyanql_swap_size_bytes)
        fail_msg: >-
          {{ nyanql_swap_path }} already exists but is not 10 GB. It was left untouched;
          inspect it manually before rerunning this playbook.

    - name: Allocate 10 GB swap file
      ansible.builtin.command:
        argv:
          - fallocate
          - -l
          - "{{ nyanql_swap_size }}"
          - "{{ nyanql_swap_path }}"
      when: not nyanql_swap_file.stat.exists

    - name: Protect swap file permissions
      ansible.builtin.file:
        path: "{{ nyanql_swap_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format new swap file
      ansible.builtin.command:
        argv:
          - mkswap
          - "{{ nyanql_swap_path }}"
      when: not nyanql_swap_file.stat.exists

    - name: Inspect active swap
      ansible.builtin.command:
        argv:
          - swapon
          - --show=NAME
          - --noheadings
      register: nyanql_active_swap
      changed_when: false

    - name: Enable swap file
      ansible.builtin.command:
        argv:
          - swapon
          - "{{ nyanql_swap_path }}"
      when: nyanql_swap_path not in nyanql_active_swap.stdout

    - name: Persist swap file
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s+'
        line: "{{ nyanql_swap_path }} none swap sw 0 0"
        state: present

    - name: Allow required TCP ports through UFW
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - "{{ item }}/tcp"
      loop:
        - "{{ nyanql_ssh_port }}"
        - "80"
        - "{{ nyanql_https_port }}"
      register: nyanql_ufw_rules
      changed_when: "'Rule added' in nyanql_ufw_rules.stdout"

    - name: Inspect UFW status
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: nyanql_ufw_status
      changed_when: false

    - name: Enable UFW
      ansible.builtin.command:
        argv:
          - ufw
          - --force
          - enable
      when: "'Status: active' not in nyanql_ufw_status.stdout"

    - name: Ensure SSH drop-in directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure SSH port 2222
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-nyanql-port.conf
        content: |
          # Managed by the NyanQL Ansible deployment.
          Port {{ nyanql_ssh_port }}
        owner: root
        group: root
        mode: "0644"
      notify: Reload SSH

    - name: Validate SSH daemon configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    - name: Create NyanQL service group
      ansible.builtin.group:
        name: "{{ nyanql_service_group }}"
        system: true

    - name: Create NyanQL service account
      ansible.builtin.user:
        name: "{{ nyanql_service_user }}"
        group: "{{ nyanql_service_group }}"
        system: true
        home: "{{ nyanql_root }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create NyanQL directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ nyanql_root }}", owner: root, group: root, mode: "0755"}
        - {path: "{{ nyanql_source_dir }}", owner: root, group: root, mode: "0755"}
        - {path: "{{ nyanql_binary_dir }}", owner: root, group: root, mode: "0755"}
        - {path: "{{ nyanql_config_dir }}", owner: root, group: "{{ nyanql_service_group }}", mode: "0750"}
        - {path: "{{ nyanql_tls_dir }}", owner: root, group: "{{ nyanql_service_group }}", mode: "0750"}
        - {path: "{{ nyanql_data_dir }}", owner: "{{ nyanql_service_user }}", group: "{{ nyanql_service_group }}", mode: "0750"}
        - {path: "{{ nyanql_backup_dir }}", owner: "{{ nyanql_service_user }}", group: "{{ nyanql_service_group }}", mode: "0700"}
        - {path: "{{ nyanql_log_dir }}", owner: "{{ nyanql_service_user }}", group: "{{ nyanql_service_group }}", mode: "0750"}
        - {path: "{{ nyanql_acme_webroot }}", owner: "{{ nyanql_service_user }}", group: "{{ nyanql_service_group }}", mode: "0755"}
        - {path: "{{ nyanql_build_dir }}", owner: "{{ ansible_user }}", group: "{{ ansible_user }}", mode: "0750"}

    - name: Inspect installed Go version
      ansible.builtin.command:
        argv:
          - /usr/local/go/bin/go
          - version
      register: nyanql_go_installed
      failed_when: false
      changed_when: false

    - name: Download pinned Go toolchain
      ansible.builtin.get_url:
        url: "https://go.dev/dl/go{{ go_version }}.linux-{{ go_archive_arch }}.tar.gz"
        dest: "/var/tmp/go{{ go_version }}.linux-{{ go_archive_arch }}.tar.gz"
        checksum: "sha256:{{ go_archive_checksums[go_archive_arch] }}"
        owner: root
        group: root
        mode: "0644"
      when: "('go' + go_version) not in nyanql_go_installed.stdout"

    - name: Remove superseded Go toolchain
      ansible.builtin.file:
        path: /usr/local/go
        state: absent
      when: "('go' + go_version) not in nyanql_go_installed.stdout"

    - name: Install pinned Go toolchain
      ansible.builtin.unarchive:
        src: "/var/tmp/go{{ go_version }}.linux-{{ go_archive_arch }}.tar.gz"
        dest: /usr/local
        remote_src: true
        owner: root
        group: root
      when: "('go' + go_version) not in nyanql_go_installed.stdout"

    - name: Find stale standalone Go sources on the VPS
      ansible.builtin.find:
        paths: "{{ nyanql_source_dir }}"
        patterns:
          - "*.go"
        excludes:
          - main.go
        file_type: file
        recurse: false
      register: nyanql_stale_go_sources

    - name: Remove stale standalone Go sources from the managed source directory
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ nyanql_stale_go_sources.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Copy Go module files and main source
      ansible.builtin.copy:
        src: "{{ project_root }}/{{ item }}"
        dest: "{{ nyanql_source_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - go.mod
        - go.sum
        - main.go
      notify: Restart NyanQL

    - name: Copy JavaScript sources
      ansible.builtin.copy:
        src: "{{ project_root }}/javascript/"
        dest: "{{ nyanql_source_dir }}/javascript/"
        owner: root
        group: root
        directory_mode: "0755"
        mode: "0644"
      notify: Restart NyanQL

    - name: Copy SQL sources
      ansible.builtin.copy:
        src: "{{ project_root }}/sql/"
        dest: "{{ nyanql_source_dir }}/sql/"
        owner: root
        group: root
        directory_mode: "0755"
        mode: "0644"
      notify: Restart NyanQL

    - name: Stage VPS API configuration until the domain certificate is ready
      ansible.builtin.copy:
        src: "{{ project_root }}/api.vps.json"
        dest: "{{ nyanql_staged_api_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Render VPS runtime configuration
      ansible.builtin.template:
        src: templates/config.json.j2
        dest: "{{ nyanql_config_dir }}/config.json"
        owner: root
        group: "{{ nyanql_service_group }}"
        mode: "0640"
      no_log: true
      notify: Restart NyanQL

    - name: Inspect remote SQLite database
      ansible.builtin.stat:
        path: "{{ nyanql_database_path }}"
      register: nyanql_database

    - name: Seed SQLite database only on first deployment
      ansible.builtin.copy:
        src: "{{ nyanql_seed_database }}"
        dest: "{{ nyanql_database_path }}"
        owner: "{{ nyanql_service_user }}"
        group: "{{ nyanql_service_group }}"
        mode: "0640"
      when: not nyanql_database.stat.exists

    - name: Protect SQLite database ownership
      ansible.builtin.file:
        path: "{{ nyanql_database_path }}"
        owner: "{{ nyanql_service_user }}"
        group: "{{ nyanql_service_group }}"
        mode: "0640"

    - name: Inspect applied OAuth migrations
      ansible.builtin.command:
        argv:
          - sqlite3
          - -bail
          - -cmd
          - ".timeout 10000"
          - "{{ nyanql_database_path }}"
          - "SELECT version FROM oauth_schema_migrations ORDER BY version;"
      become_user: "{{ nyanql_service_user }}"
      register: oauth_migration_versions
      failed_when: oauth_migration_versions.rc not in [0, 1]
      changed_when: false

    - name: Back up SQLite before OAuth schema or credential-reset migration
      ansible.builtin.command:
        argv:
          - sqlite3
          - -bail
          - -cmd
          - ".timeout 10000"
          - "{{ nyanql_database_path }}"
          - ".backup {{ nyanql_pre_migration_backup }}"
      args:
        creates: "{{ nyanql_pre_migration_backup }}"
      become_user: "{{ nyanql_service_user }}"
      when: >-
        '1' not in oauth_migration_versions.stdout_lines or
        '2' not in oauth_migration_versions.stdout_lines or
        '3' not in oauth_migration_versions.stdout_lines

    - name: Apply OAuth migration 001
      ansible.builtin.command:
        argv:
          - sqlite3
          - -bail
          - -cmd
          - ".timeout 10000"
          - "{{ nyanql_database_path }}"
          - ".read {{ nyanql_source_dir }}/sql/oauth/001_init.sql"
      become_user: "{{ nyanql_service_user }}"
      when: "'1' not in oauth_migration_versions.stdout_lines"
      notify: Restart NyanQL

    - name: Apply OAuth migration 002
      ansible.builtin.command:
        argv:
          - sqlite3
          - -bail
          - -cmd
          - ".timeout 10000"
          - "{{ nyanql_database_path }}"
          - ".read {{ nyanql_source_dir }}/sql/oauth/002_reset_pre_policy_credentials.sql"
      become_user: "{{ nyanql_service_user }}"
      when: "'2' not in oauth_migration_versions.stdout_lines"
      notify: Restart NyanQL

    - name: Apply OAuth migration 003
      ansible.builtin.command:
        argv:
          - sqlite3
          - -bail
          - -cmd
          - ".timeout 10000"
          - "{{ nyanql_database_path }}"
          - ".read {{ nyanql_source_dir }}/sql/oauth/003_add_refresh_tokens.sql"
      become_user: "{{ nyanql_service_user }}"
      when: "'3' not in oauth_migration_versions.stdout_lines"
      notify: Restart NyanQL

    - name: Inspect OAuth user table columns
      ansible.builtin.command:
        argv:
          - sqlite3
          - -readonly
          - -bail
          - "{{ nyanql_database_path }}"
          - "SELECT name FROM pragma_table_info('oauth_users') ORDER BY cid;"
      become_user: "{{ nyanql_service_user }}"
      register: nyanql_oauth_user_columns
      changed_when: false

    - name: Verify OAuth user table compatibility
      ansible.builtin.assert:
        that:
          - >-
            (nyanql_required_oauth_user_columns |
            difference(nyanql_oauth_user_columns.stdout_lines) | length) == 0
        fail_msg: >-
          The existing oauth_users table is incompatible with the JavaScript
          OAuth implementation. The database was left untouched; inspect the
          pre-migration backup before repairing the legacy schema.
      vars:
        nyanql_required_oauth_user_columns:
          - id
          - username
          - password_hash
          - display_name
          - enabled
          - created_at
          - updated_at

    - name: Inspect OAuth username uniqueness constraint
      ansible.builtin.command:
        argv:
          - sqlite3
          - -readonly
          - -bail
          - "{{ nyanql_database_path }}"
          - >-
            SELECT COUNT(*)
            FROM pragma_index_list('oauth_users') AS indexes
            JOIN pragma_index_info(indexes.name) AS columns
            WHERE indexes."unique" = 1 AND columns.name = 'username';
      become_user: "{{ nyanql_service_user }}"
      register: nyanql_oauth_username_unique_indexes
      changed_when: false

    - name: Verify OAuth username uniqueness constraint
      ansible.builtin.assert:
        that:
          - (nyanql_oauth_username_unique_indexes.stdout | int) >= 1
        fail_msg: >-
          The existing oauth_users table has no unique username constraint and
          cannot support the JavaScript OAuth bootstrap safely. The database
          was left untouched.

    - name: Download Go dependencies on the VPS
      ansible.builtin.command:
        argv:
          - /usr/local/go/bin/go
          - mod
          - download
      args:
        chdir: "{{ nyanql_source_dir }}"
      become_user: "{{ ansible_user }}"
      environment:
        GOPATH: "{{ nyanql_build_dir }}/gopath"
        GOCACHE: "{{ nyanql_build_dir }}/gocache"
      changed_when: false

    - name: Build NyanQL on the VPS
      ansible.builtin.command:
        argv:
          - /usr/local/go/bin/go
          - build
          - -buildvcs=false
          - -trimpath
          - -ldflags
          - "-s -w -X main.buildVersion={{ nyanql_version }}"
          - -o
          - "{{ nyanql_build_dir }}/NyanQL"
          - .
      args:
        chdir: "{{ nyanql_source_dir }}"
      become_user: "{{ ansible_user }}"
      environment:
        GOPATH: "{{ nyanql_build_dir }}/gopath"
        GOCACHE: "{{ nyanql_build_dir }}/gocache"
        CGO_ENABLED: "1"
      changed_when: false

    - name: Inspect the currently installed NyanQL binary
      ansible.builtin.stat:
        path: "{{ nyanql_binary_path }}"
      register: nyanql_installed_binary

    - name: Preserve the previous NyanQL binary for rollback
      ansible.builtin.copy:
        src: "{{ nyanql_binary_path }}"
        dest: "{{ nyanql_previous_binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when: nyanql_installed_binary.stat.exists

    - name: Install the built NyanQL binary
      ansible.builtin.copy:
        src: "{{ nyanql_build_dir }}/NyanQL"
        dest: "{{ nyanql_binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart NyanQL

    - name: Create isolated Certbot virtual environment
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - venv
          - "{{ certbot_venv }}"
      args:
        creates: "{{ certbot_venv }}/bin/pip"

    - name: Install Certbot 5.4 or newer capability set
      ansible.builtin.pip:
        name: "certbot=={{ certbot_version }}"
        executable: "{{ certbot_venv }}/bin/pip"
        state: present

    - name: Link Certbot command
      ansible.builtin.file:
        src: "{{ certbot_venv }}/bin/certbot"
        dest: /usr/local/bin/certbot
        state: link
        force: true

    - name: Install ACME challenge webroot service
      ansible.builtin.template:
        src: templates/nyanql-acme-webroot.service.j2
        dest: /etc/systemd/system/nyanql-acme-webroot.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart ACME webroot

    - name: Start ACME challenge webroot service
      ansible.builtin.systemd_service:
        name: nyanql-acme-webroot.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Resolve the public hostname from the VPS
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ nyanql_public_hostname }}"
      register: nyanql_public_dns
      changed_when: false
      failed_when: false

    - name: Verify the public hostname resolves to this VPS
      ansible.builtin.assert:
        that:
          - nyanql_public_dns.rc == 0
          - nyanql_public_ip in nyanql_public_dns.stdout.split()
        fail_msg: >-
          {{ nyanql_public_hostname }} must have a DNS A record pointing to
          {{ nyanql_public_ip }} before Let's Encrypt can issue the certificate.

    - name: Ensure the ACME HTTP-01 challenge directory exists
      ansible.builtin.file:
        path: "{{ nyanql_acme_webroot }}/.well-known/acme-challenge"
        state: directory
        owner: "{{ nyanql_service_user }}"
        group: "{{ nyanql_service_group }}"
        mode: "0755"

    - name: Verify public HTTP-01 challenge routing
      vars:
        nyanql_acme_preflight_name: "nyanql-ansible-{{ ansible_date_time.epoch }}"
        nyanql_acme_preflight_token: "nyanql-acme-preflight-{{ ansible_date_time.epoch }}"
        nyanql_acme_preflight_path: >-
          {{ nyanql_acme_webroot }}/.well-known/acme-challenge/{{ nyanql_acme_preflight_name }}
      block:
        - name: Create temporary ACME HTTP-01 preflight token
          ansible.builtin.copy:
            content: "{{ nyanql_acme_preflight_token }}\n"
            dest: "{{ nyanql_acme_preflight_path }}"
            owner: "{{ nyanql_service_user }}"
            group: "{{ nyanql_service_group }}"
            mode: "0644"

        - name: Fetch temporary ACME token through the public hostname
          ansible.builtin.uri:
            url: >-
              http://{{ nyanql_public_hostname }}/.well-known/acme-challenge/{{ nyanql_acme_preflight_name }}
            method: GET
            return_content: true
            status_code: 200
          delegate_to: localhost
          become: false
          register: nyanql_acme_preflight_response

        - name: Verify the public ACME token response
          ansible.builtin.assert:
            that:
              - (nyanql_acme_preflight_response.content | trim) == nyanql_acme_preflight_token
            fail_msg: >-
              Port 80 for {{ nyanql_public_hostname }} did not return the token
              written to {{ nyanql_acme_webroot }}.
      always:
        - name: Remove temporary ACME HTTP-01 preflight token
          ansible.builtin.file:
            path: "{{ nyanql_acme_preflight_path }}"
            state: absent

    - name: Install certificate deployment hook
      ansible.builtin.template:
        src: templates/install-certificate.sh.j2
        dest: /usr/local/sbin/nyanql-install-certificate
        owner: root
        group: root
        mode: "0750"

    - name: Create Certbot deploy-hook directory
      ansible.builtin.file:
        path: /etc/letsencrypt/renewal-hooks/deploy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Link certificate hook into Certbot deploy hooks
      ansible.builtin.file:
        src: /usr/local/sbin/nyanql-install-certificate
        dest: /etc/letsencrypt/renewal-hooks/deploy/nyanql-install-certificate
        state: link
        force: true

    - name: Inspect issued domain certificate
      ansible.builtin.stat:
        path: "{{ letsencrypt_live_dir }}/fullchain.pem"
        follow: true
      register: nyanql_letsencrypt_certificate

    - name: Issue Let's Encrypt certificate for the public hostname
      ansible.builtin.command:
        argv:
          - "{{ certbot_venv }}/bin/certbot"
          - certonly
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ letsencrypt_email }}"
          - --preferred-challenges
          - http-01
          - --webroot
          - --webroot-path
          - "{{ nyanql_acme_webroot }}"
          - --domains
          - "{{ nyanql_public_hostname }}"
          - --cert-name
          - "{{ letsencrypt_cert_name }}"
      when: not nyanql_letsencrypt_certificate.stat.exists

    - name: Inspect the domain certificate after issuance
      ansible.builtin.stat:
        path: "{{ letsencrypt_live_dir }}/fullchain.pem"
        follow: true
      register: nyanql_domain_certificate

    - name: Verify the domain certificate was created
      ansible.builtin.assert:
        that:
          - nyanql_domain_certificate.stat.exists | default(false) | bool
          - nyanql_domain_certificate.stat.isreg | default(false) | bool
          - (nyanql_domain_certificate.stat.size | default(0) | int) > 0
        fail_msg: >-
          Certbot did not create {{ letsencrypt_live_dir }}/fullchain.pem for
          {{ nyanql_public_hostname }}.

    - name: Verify the certificate covers the public hostname
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ letsencrypt_live_dir }}/fullchain.pem"
          - -noout
          - -checkhost
          - "{{ nyanql_public_hostname }}"
      changed_when: false

    - name: Ask Certbot to renew an existing certificate when due
      ansible.builtin.command:
        argv:
          - "{{ certbot_venv }}/bin/certbot"
          - renew
          - --cert-name
          - "{{ letsencrypt_cert_name }}"
          - --quiet
      when: nyanql_letsencrypt_certificate.stat.exists
      changed_when: false

    - name: Copy current certificate into the NyanQL TLS directory
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/nyanql-install-certificate
          - "{{ letsencrypt_live_dir }}"
      register: nyanql_certificate_installed
      changed_when: "'changed=1' in nyanql_certificate_installed.stdout"
      notify: Restart NyanQL

    - name: Install the staged VPS API configuration as api.json
      ansible.builtin.copy:
        src: "{{ nyanql_staged_api_path }}"
        dest: "{{ nyanql_api_path }}"
        remote_src: true
        owner: root
        group: "{{ nyanql_service_group }}"
        mode: "0640"
      notify: Restart NyanQL

    - name: Install Certbot renewal service
      ansible.builtin.template:
        src: templates/nyanql-certbot-renew.service.j2
        dest: /etc/systemd/system/nyanql-certbot-renew.service
        owner: root
        group: root
        mode: "0644"

    - name: Install Certbot renewal timer
      ansible.builtin.template:
        src: templates/nyanql-certbot-renew.timer.j2
        dest: /etc/systemd/system/nyanql-certbot-renew.timer
        owner: root
        group: root
        mode: "0644"

    - name: Enable automatic domain certificate renewal
      ansible.builtin.systemd_service:
        name: nyanql-certbot-renew.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Install NyanQL systemd service
      ansible.builtin.template:
        src: templates/nyanql.service.j2
        dest: /etc/systemd/system/nyanql.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart NyanQL

    - name: Apply pending service changes
      ansible.builtin.meta: flush_handlers

    - name: Ensure NyanQL is enabled and running
      ansible.builtin.systemd_service:
        name: nyanql.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Inspect OAuth user count
      ansible.builtin.command:
        argv:
          - sqlite3
          - -readonly
          - -bail
          - "{{ nyanql_database_path }}"
          - "SELECT COUNT(*) FROM oauth_users;"
      become_user: "{{ nyanql_service_user }}"
      register: nyanql_oauth_user_count
      changed_when: false

    - name: Wait for the local NyanQL TLS listener before OAuth bootstrap
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ nyanql_https_port }}"
        state: started
        connect_timeout: 2
        timeout: 30
      when: (nyanql_oauth_user_count.stdout | int) == 0

    - name: Verify the protected OAuth bootstrap endpoint over loopback
      ansible.builtin.command:
        argv:
          - curl
          - --disable
          - --noproxy
          - "*"
          - --silent
          - --show-error
          - --connect-timeout
          - "10"
          - --max-time
          - "20"
          - --resolve
          - "{{ nyanql_public_hostname }}:{{ nyanql_https_port }}:127.0.0.1"
          - --request
          - POST
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - "{{ nyanql_public_origin }}/oauth/admin/users"
      when: (nyanql_oauth_user_count.stdout | int) == 0
      register: nyanql_oauth_bootstrap_preflight
      changed_when: false
      retries: 5
      delay: 2
      until:
        - nyanql_oauth_bootstrap_preflight.rc == 0
        - (nyanql_oauth_bootstrap_preflight.stdout | trim) == '401'

    - name: Bootstrap the first OAuth user through the protected local endpoint
      when: (nyanql_oauth_user_count.stdout | int) == 0
      block:
        - name: Create a deployment-user-only temporary curl configuration
          ansible.builtin.tempfile:
            state: file
            path: /tmp
            prefix: nyanql-oauth-bootstrap-curl-
            suffix: .conf
          register: nyanql_oauth_bootstrap_curl_config
          become: false

        - name: Write the temporary curl configuration without logging credentials
          ansible.builtin.copy:
            content: |
              noproxy = "*"
              silent
              show-error
              connect-timeout = 10
              max-time = 30
              resolve = {{ (nyanql_public_hostname + ':' + (nyanql_https_port | string) + ':127.0.0.1') | to_json }}
              request = "POST"
              header = {{ ('Authorization: Basic ' + ((nyanql_basic_username + ':' + nyanql_basic_password) | b64encode)) | to_json }}
              header = "Content-Type: application/json"
              data-binary = "@-"
              output = "/dev/null"
              write-out = "%{http_code}"
              url = {{ (nyanql_public_origin + '/oauth/admin/users') | to_json }}
            dest: "{{ nyanql_oauth_bootstrap_curl_config.path }}"
            mode: "0600"
          become: false
          no_log: true

        - name: Submit the OAuth bootstrap JSON over protected loopback HTTPS
          ansible.builtin.command:
            argv:
              - curl
              - --disable
              - --config
              - "{{ nyanql_oauth_bootstrap_curl_config.path }}"
            stdin: >-
              {{ {'username': nyanql_oauth_username,
                  'password': nyanql_oauth_password} | to_json }}
          register: nyanql_oauth_bootstrap
          failed_when: false
          changed_when: >-
            nyanql_oauth_bootstrap.rc == 0 and
            (nyanql_oauth_bootstrap.stdout | trim) == '200'
          become: false
          no_log: true
      always:
        - name: Remove the temporary curl configuration
          ansible.builtin.file:
            path: "{{ nyanql_oauth_bootstrap_curl_config.path }}"
            state: absent
          become: false
          when:
            - nyanql_oauth_bootstrap_curl_config is defined
            - nyanql_oauth_bootstrap_curl_config.path is defined

    - name: Verify OAuth bootstrap response without exposing credentials
      ansible.builtin.assert:
        that:
          - nyanql_oauth_bootstrap.rc == 0
          - (nyanql_oauth_bootstrap.stdout | trim) == '200'
        fail_msg: >-
          OAuth bootstrap failed with curl rc={{ nyanql_oauth_bootstrap.rc }} and
          HTTP status={{ (nyanql_oauth_bootstrap.stdout | trim)
          if (nyanql_oauth_bootstrap.stdout | trim) is match('^[0-9]{3}$')
          else 'unknown' }}. HTTP 400 indicates invalid OAuth input; 401 indicates
          Basic Auth mismatch; 403 indicates a non-loopback request; 429 indicates
          rate limiting; and 500 indicates an application or SQLite schema error.
      when: (nyanql_oauth_user_count.stdout | int) == 0

    - name: Inspect OAuth user count after bootstrap
      ansible.builtin.command:
        argv:
          - sqlite3
          - -readonly
          - -bail
          - "{{ nyanql_database_path }}"
          - "SELECT COUNT(*) FROM oauth_users;"
      become_user: "{{ nyanql_service_user }}"
      register: nyanql_oauth_user_count_after_bootstrap
      changed_when: false

    - name: Verify at least one OAuth user exists
      ansible.builtin.assert:
        that:
          - (nyanql_oauth_user_count_after_bootstrap.stdout | int) >= 1
        fail_msg: >-
          OAuth bootstrap returned successfully but no OAuth user exists in
          SQLite. The deployment was stopped before external MCP verification.

    - name: Verify trusted protected-resource metadata response
      ansible.builtin.uri:
        url: "{{ nyanql_public_origin }}/.well-known/oauth-protected-resource/mcp"
        method: GET
        return_content: true
        status_code: 200
        validate_certs: true
      delegate_to: localhost
      become: false
      register: nyanql_protected_resource_check
      retries: 5
      delay: 3
      until:
        - nyanql_protected_resource_check.status == 200
        - nyanql_protected_resource_check.json.resource == (nyanql_public_origin + '/mcp')
        - "'offline_access' in nyanql_protected_resource_check.json.scopes_supported"

    - name: Verify trusted authorization-server metadata response
      ansible.builtin.uri:
        url: "{{ nyanql_public_origin }}/.well-known/oauth-authorization-server"
        method: GET
        return_content: true
        status_code: 200
        validate_certs: true
      delegate_to: localhost
      become: false
      register: nyanql_authorization_server_check
      retries: 5
      delay: 3
      until:
        - nyanql_authorization_server_check.status == 200
        - nyanql_authorization_server_check.json.issuer == nyanql_public_origin
        - nyanql_authorization_server_check.json.authorization_endpoint == (nyanql_public_origin + '/oauth/authorize')
        - nyanql_authorization_server_check.json.token_endpoint == (nyanql_public_origin + '/oauth/token')
        - nyanql_authorization_server_check.json.registration_endpoint == (nyanql_public_origin + '/oauth/register')
        - "'offline_access' in nyanql_authorization_server_check.json.scopes_supported"
        - "'refresh_token' in nyanql_authorization_server_check.json.grant_types_supported"

    - name: Verify MCP initialize over trusted HTTPS
      ansible.builtin.uri:
        url: "{{ nyanql_public_origin }}/mcp"
        method: POST
        headers:
          Accept: "application/json, text/event-stream"
          Content-Type: application/json
          MCP-Protocol-Version: "2025-11-25"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: initialize
          params:
            protocolVersion: "2025-11-25"
            capabilities: {}
            clientInfo:
              name: ansible-healthcheck
              version: "1.0"
        return_content: true
        status_code: 200
        validate_certs: true
      delegate_to: localhost
      become: false
      register: nyanql_mcp_initialize_check
      retries: 5
      delay: 3
      until:
        - nyanql_mcp_initialize_check.status == 200
        - nyanql_mcp_initialize_check.json.result.protocolVersion == '2025-11-25'

    - name: Inspect UFW before retiring the obsolete HTTPS port
      ansible.builtin.command:
        argv:
          - ufw
          - status
      register: nyanql_ufw_status_after_https_check
      changed_when: false

    - name: Remove obsolete NyanQL HTTPS port 2255 from UFW
      ansible.builtin.command:
        argv:
          - ufw
          - --force
          - delete
          - allow
          - 2255/tcp
      when: "'2255/tcp' in nyanql_ufw_status_after_https_check.stdout"
      register: nyanql_obsolete_ufw_rule
      changed_when: "'Rule deleted' in nyanql_obsolete_ufw_rule.stdout"

    - name: Inspect the legacy Let's Encrypt IP certificate
      ansible.builtin.stat:
        path: "/etc/letsencrypt/renewal/{{ legacy_letsencrypt_cert_name }}.conf"
      register: nyanql_legacy_ip_certificate
      when: nyanql_remove_legacy_ip_certificate | bool

    - name: Remove the legacy Let's Encrypt IP certificate after successful checks
      ansible.builtin.command:
        argv:
          - "{{ certbot_venv }}/bin/certbot"
          - delete
          - --non-interactive
          - --cert-name
          - "{{ legacy_letsencrypt_cert_name }}"
      when:
        - nyanql_remove_legacy_ip_certificate | bool
        - nyanql_legacy_ip_certificate.stat.exists

  handlers:
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

    - name: Restart ACME webroot
      ansible.builtin.systemd_service:
        name: nyanql-acme-webroot.service
        state: restarted
        daemon_reload: true

    - name: Restart NyanQL
      ansible.builtin.systemd_service:
        name: nyanql.service
        state: restarted
        daemon_reload: true
