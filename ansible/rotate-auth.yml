---
- name: Rotate NyanQL Basic Auth and OAuth operator credentials
  hosts: nyanql
  become: true
  gather_facts: false

  vars_prompt:
    - name: nyanql_basic_username
      prompt: "NyanQL Basic Auth username (':' is not allowed)"
      private: false
    - name: nyanql_basic_password
      prompt: "NyanQL Basic Auth password (12 characters or longer)"
      private: true
      confirm: true
    - name: nyanql_oauth_username
      prompt: "OAuth username (3 to 128 characters)"
      private: false
    - name: nyanql_oauth_password
      prompt: "OAuth password (12 characters or longer)"
      private: true
      confirm: true

  vars:
    nyanql_public_hostname: stamp.necomori.asia
    nyanql_public_origin: "https://{{ nyanql_public_hostname }}"
    nyanql_https_port: 443
    nyanql_runtime_config_path: /etc/nyanql/config.json
    nyanql_database_path: /var/lib/nyanql/stamps.db
    nyanql_service_user: nyanql
    nyanql_service_group: nyanql

  pre_tasks:
    - name: Validate credential rotation input
      ansible.builtin.assert:
        that:
          - (nyanql_basic_username | string | trim | length) > 0
          - (nyanql_basic_username | string | trim | upper) != 'CHANGE_ME'
          - "':' not in (nyanql_basic_username | string)"
          - (nyanql_oauth_username | string | trim) is match('^[A-Za-z0-9._~-]{3,128}$')
          - (nyanql_oauth_username | string | trim | upper) != 'CHANGE_ME'
        fail_msg: >-
          Basic Auth and OAuth usernames are invalid. OAuth usernames used by
          this rotation playbook may contain letters, digits, dot, underscore,
          tilde, and hyphen.

    - name: Validate credential rotation passwords
      ansible.builtin.assert:
        that:
          - (nyanql_basic_password | string | length) >= 12
          - (nyanql_basic_password | string | upper) != 'CHANGE_ME'
          - (nyanql_oauth_password | string | length) >= 12
          - (nyanql_oauth_password | string | length) <= 1024
          - (nyanql_oauth_password | string | upper) != 'CHANGE_ME'
        fail_msg: >-
          Both passwords must contain at least 12 characters and must not be
          CHANGE_ME. The OAuth password may contain at most 1024 characters.
      no_log: true

  tasks:
    - name: Read the current NyanQL runtime configuration
      ansible.builtin.slurp:
        src: "{{ nyanql_runtime_config_path }}"
      register: nyanql_current_runtime_config
      no_log: true

    - name: Prepare the runtime configuration with rotated Basic Auth
      ansible.builtin.set_fact:
        nyanql_rotated_runtime_config: >-
          {{
            (nyanql_current_runtime_config.content | b64decode | from_json)
            | combine(
                {'BasicAuth': {
                  'Username': nyanql_basic_username | trim,
                  'Password': nyanql_basic_password
                }},
                recursive=True
              )
          }}
      no_log: true

    - name: Install the runtime configuration without retaining the old password
      ansible.builtin.copy:
        content: "{{ nyanql_rotated_runtime_config | to_nice_json }}\n"
        dest: "{{ nyanql_runtime_config_path }}"
        owner: root
        group: "{{ nyanql_service_group }}"
        mode: "0640"
      no_log: true
      notify: Restart NyanQL

    - name: Apply the Basic Auth rotation before updating OAuth
      ansible.builtin.meta: flush_handlers

    - name: Wait for the local TLS listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ nyanql_https_port }}"
        state: started
        connect_timeout: 2
        timeout: 30

    - name: Upsert the requested OAuth user through protected loopback HTTPS
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ nyanql_https_port }}/oauth/admin/users"
        method: POST
        headers:
          Host: "{{ nyanql_public_hostname }}"
        url_username: "{{ nyanql_basic_username | trim }}"
        url_password: "{{ nyanql_basic_password }}"
        force_basic_auth: true
        body_format: json
        body:
          username: "{{ nyanql_oauth_username | trim }}"
          password: "{{ nyanql_oauth_password }}"
        status_code: 200
        validate_certs: false
        return_content: false
      register: nyanql_oauth_upsert
      no_log: true

    - name: Disable superseded OAuth users and revoke existing OAuth sessions
      ansible.builtin.command:
        argv:
          - sqlite3
          - -bail
          - -cmd
          - ".timeout 10000"
          - "{{ nyanql_database_path }}"
          - >-
            BEGIN IMMEDIATE;
            UPDATE oauth_users
            SET enabled = CASE
                  WHEN username = '{{ nyanql_oauth_username | trim }}' COLLATE NOCASE THEN 1
                  ELSE 0
                END,
                updated_at = CAST(strftime('%s', 'now') AS INTEGER);
            UPDATE oauth_authorization_requests
            SET consumed_at = COALESCE(consumed_at, CAST(strftime('%s', 'now') AS INTEGER))
            WHERE consumed_at IS NULL;
            UPDATE oauth_authorization_codes
            SET consumed_at = COALESCE(consumed_at, CAST(strftime('%s', 'now') AS INTEGER))
            WHERE consumed_at IS NULL;
            UPDATE oauth_access_tokens
            SET revoked_at = COALESCE(revoked_at, CAST(strftime('%s', 'now') AS INTEGER))
            WHERE revoked_at IS NULL;
            UPDATE oauth_refresh_token_families
            SET revoked_at = COALESCE(revoked_at, CAST(strftime('%s', 'now') AS INTEGER))
            WHERE revoked_at IS NULL;
            UPDATE oauth_refresh_tokens
            SET revoked_at = COALESCE(revoked_at, CAST(strftime('%s', 'now') AS INTEGER))
            WHERE revoked_at IS NULL;
            COMMIT;
      become_user: "{{ nyanql_service_user }}"
      no_log: true

    - name: Verify the rotated OAuth account state
      ansible.builtin.command:
        argv:
          - sqlite3
          - -readonly
          - -bail
          - "{{ nyanql_database_path }}"
          - >-
            SELECT
              (SELECT COUNT(*) FROM oauth_users
               WHERE username = '{{ nyanql_oauth_username | trim }}' COLLATE NOCASE
                 AND enabled = 1)
              || '|'
              || (SELECT COUNT(*) FROM oauth_users
                  WHERE username != '{{ nyanql_oauth_username | trim }}' COLLATE NOCASE
                    AND enabled = 1)
              || '|'
              || (SELECT COUNT(*) FROM oauth_access_tokens WHERE revoked_at IS NULL)
              || '|'
              || (SELECT COUNT(*) FROM oauth_refresh_token_families WHERE revoked_at IS NULL);
      become_user: "{{ nyanql_service_user }}"
      register: nyanql_rotated_oauth_state
      changed_when: false
      no_log: true

    - name: Confirm only the requested OAuth user remains active
      ansible.builtin.assert:
        that:
          - (nyanql_rotated_oauth_state.stdout | trim) == '1|0|0|0'
        fail_msg: >-
          Credential rotation completed, but the resulting OAuth user or token
          state did not pass validation.

    - name: Verify public HTTPS metadata after credential rotation
      ansible.builtin.uri:
        url: "{{ nyanql_public_origin }}/.well-known/oauth-authorization-server"
        method: GET
        status_code: 200
        validate_certs: true
      delegate_to: localhost
      become: false

  handlers:
    - name: Restart NyanQL
      ansible.builtin.systemd_service:
        name: nyanql.service
        state: restarted
        daemon_reload: true
